apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: teleportal-production
  namespace: teleportal-app
  labels:
    app.kubernetes.io/part-of: teleportal
spec:
  clusterSets:
    - telenet-production
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            environment: production
            region: belgium
        claimSelector:
          matchExpressions:
            - key: platform.open-cluster-management.io
              operator: In
              values:
                - OpenShift
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: teleportal-staging
  namespace: teleportal-app
  labels:
    app.kubernetes.io/part-of: teleportal
spec:
  clusterSets:
    - telenet-staging
  numberOfClusters: 1
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchLabels:
            environment: staging
