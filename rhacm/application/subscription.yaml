apiVersion: apps.open-cluster-management.io/v1
kind: Subscription
metadata:
  name: teleportal-subscription
  namespace: teleportal-app
  labels:
    app.kubernetes.io/part-of: teleportal
  annotations:
    apps.open-cluster-management.io/git-branch: main
    apps.open-cluster-management.io/git-path: k8s/overlays/production
    apps.open-cluster-management.io/reconcile-option: merge
spec:
  channel: teleportal-app/teleportal-git
  placement:
    placementRef:
      kind: Placement
      name: teleportal-production
