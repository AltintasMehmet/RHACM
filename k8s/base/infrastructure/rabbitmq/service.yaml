apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: teleportal-infra
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: teleportal
    app.kubernetes.io/component: infrastructure
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - port: 5672
      targetPort: 5672
      protocol: TCP
      name: amqp
    - port: 15672
      targetPort: 15672
      protocol: TCP
      name: management
