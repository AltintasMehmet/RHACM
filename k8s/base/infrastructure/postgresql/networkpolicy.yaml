apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: subscriber-db-allow-ingress
  namespace: teleportal-infra
  labels:
    app.kubernetes.io/name: subscriber-db
    app.kubernetes.io/part-of: teleportal
    app.kubernetes.io/component: infrastructure
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: subscriber-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: teleportal
          podSelector:
            matchLabels:
              app.kubernetes.io/name: subscriber-service
      ports:
        - protocol: TCP
          port: 5432
---
