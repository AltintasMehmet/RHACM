apiVersion: v1
kind: Namespace
metadata:
  name: teleportal-infra
  labels:
    app.kubernetes.io/part-of: teleportal
    environment: dev
    team: teleportal
    compliance: required
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: teleportal-infra-quota
  namespace: teleportal-infra
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 8Gi
    limits.cpu: "16"
    limits.memory: 16Gi
    pods: "20"
    services: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: teleportal-infra-limits
  namespace: teleportal-infra
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
    - type: Pod
      max:
        cpu: "4"
        memory: 4Gi
