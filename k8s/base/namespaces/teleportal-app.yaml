apiVersion: v1
kind: Namespace
metadata:
  name: teleportal-app
  labels:
    app.kubernetes.io/part-of: teleportal
    environment: dev
    team: teleportal
    compliance: required
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: teleportal-app-quota
  namespace: teleportal-app
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
    services: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: teleportal-app-limits
  namespace: teleportal-app
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
    - type: Pod
      max:
        cpu: "4"
        memory: 4Gi
