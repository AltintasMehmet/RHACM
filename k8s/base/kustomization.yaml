apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Namespaces
  - namespaces/teleportal-app.yaml
  - namespaces/teleportal-infra.yaml

  # Builds (OpenShift BuildConfigs + ImageStreams)
  - builds/imagestreams.yaml
  - builds/buildconfigs.yaml

  # Infrastructure - PostgreSQL
  - infrastructure/postgresql/statefulset.yaml
  - infrastructure/postgresql/service.yaml
  - infrastructure/postgresql/secret.yaml

  # Infrastructure - Redis
  - infrastructure/redis/statefulset.yaml
  - infrastructure/redis/service.yaml

  # Infrastructure - RabbitMQ
  - infrastructure/rabbitmq/statefulset.yaml
  - infrastructure/rabbitmq/service.yaml

  # Services - API Gateway
  - services/api-gateway/deployment.yaml
  - services/api-gateway/service.yaml
  - services/api-gateway/configmap.yaml
  - services/api-gateway/route.yaml

  # Services - Subscriber Service
  - services/subscriber-service/deployment.yaml
  - services/subscriber-service/service.yaml
  - services/subscriber-service/configmap.yaml
  - services/subscriber-service/secret.yaml

  # Services - Plan Service
  - services/plan-service/deployment.yaml
  - services/plan-service/service.yaml
  - services/plan-service/configmap.yaml
  - services/plan-service/secret.yaml

  # Services - Usage Service
  - services/usage-service/deployment.yaml
  - services/usage-service/service.yaml
  - services/usage-service/configmap.yaml
  - services/usage-service/secret.yaml

  # Services - Billing Service
  - services/billing-service/deployment.yaml
  - services/billing-service/service.yaml
  - services/billing-service/configmap.yaml
  - services/billing-service/secret.yaml

  # Services - Notification Service
  - services/notification-service/deployment.yaml
  - services/notification-service/service.yaml
  - services/notification-service/configmap.yaml
  - services/notification-service/secret.yaml

  # Services - Network Status Service
  - services/network-status-service/deployment.yaml
  - services/network-status-service/service.yaml
  - services/network-status-service/configmap.yaml
