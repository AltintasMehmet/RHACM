apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: network-status-service
  namespace: teleportal-app
  labels:
    app.kubernetes.io/name: network-status-service
    app.kubernetes.io/part-of: teleportal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: network-status-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
