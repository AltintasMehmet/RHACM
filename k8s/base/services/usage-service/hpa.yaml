apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: usage-service
  namespace: teleportal-app
  labels:
    app.kubernetes.io/name: usage-service
    app.kubernetes.io/part-of: teleportal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: usage-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
