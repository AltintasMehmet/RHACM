apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: usage-service
  namespace: teleportal-app
  labels:
    app.kubernetes.io/name: usage-service
    app.kubernetes.io/part-of: teleportal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: usage-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: billing-service
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: teleportal-infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: usage-db
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: teleportal-infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: teleportal-infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
