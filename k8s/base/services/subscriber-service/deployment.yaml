apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriber-service
  namespace: teleportal-app
  labels:
    app.kubernetes.io/name: subscriber-service
    app.kubernetes.io/part-of: teleportal
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: subscriber-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: subscriber-service
        app.kubernetes.io/part-of: teleportal
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: subscriber-service
          image: quay.io/teleportal/subscriber-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: subscriber-service-config
            - secretRef:
                name: subscriber-service-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
