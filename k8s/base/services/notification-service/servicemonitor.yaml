apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: notification-service
  namespace: teleportal-app
  labels:
    app.kubernetes.io/name: notification-service
    app.kubernetes.io/part-of: teleportal
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
