apiVersion: apps/v1
kind: Deployment
metadata:
  name: teleportal-demo
  namespace: teleportal-app
  labels:
    app.kubernetes.io/name: teleportal-demo
    app.kubernetes.io/instance: teleportal-demo
    app.kubernetes.io/part-of: telenet-rhacm-demo
    app.kubernetes.io/managed-by: fluxcd
    environment: demo
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: teleportal-demo
      app.kubernetes.io/instance: teleportal-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teleportal-demo
        app.kubernetes.io/instance: teleportal-demo
        app.kubernetes.io/part-of: telenet-rhacm-demo
        app.kubernetes.io/managed-by: fluxcd
        environment: demo
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: html
              mountPath: /var/www/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: teleportal-demo-html
