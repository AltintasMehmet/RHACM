# Production patches

# Core services - 3 replicas, increased resources, HPA min 3 / max 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: teleportal-app
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: api-gateway
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriber-service
  namespace: teleportal-app
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: subscriber-service
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plan-service
  namespace: teleportal-app
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: plan-service
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-service
  namespace: teleportal-app
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: usage-service
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: teleportal-app
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: billing-service
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
---
# Non-core services - keep 2 replicas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: teleportal-app
spec:
  replicas: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-status-service
  namespace: teleportal-app
spec:
  replicas: 2
---
# HPA patches for core services - minReplicas: 3, maxReplicas: 20
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: teleportal-app
spec:
  minReplicas: 3
  maxReplicas: 20
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: subscriber-service
  namespace: teleportal-app
spec:
  minReplicas: 3
  maxReplicas: 20
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: plan-service
  namespace: teleportal-app
spec:
  minReplicas: 3
  maxReplicas: 20
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: usage-service
  namespace: teleportal-app
spec:
  minReplicas: 3
  maxReplicas: 20
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: billing-service
  namespace: teleportal-app
spec:
  minReplicas: 3
  maxReplicas: 20
